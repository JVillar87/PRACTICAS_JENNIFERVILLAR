<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento HTML5</title>
</head>
<body>
    <h1>Formulario Básico</h1>
    <p>Este es un formulario básico en HTML5.</p>
    <form action="http://localhost/form/processForm.php" method="POST">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre y Apellido" required>
        <br></br>
        <label for="Edad">Edad:</label>
        <input type="number" id="Edad" name="Edad"">
        <br></br>  
        <label for="fecha">Fecha de Nacimiento:</label>
        <input type="date" id="fecha" name="fecha">
        <br></br>
        <label>Género:</label>
        <input type="radio" id="masculino" name="genero" value="Masculino">
        <label for="masculino">Masculino</label>
        <input type="radio" id="femenino" name="genero" value="Femenino">
        <label for="femenino">Femenino</label>
        <input type="radio" id="otro" name="genero" value="Otro">
        <label for="otro">Otro</label>
        <br></br>
        <label for="pais">País:</label>
        <select name="pais" id="pais">
            <option value="España">España</option>
            <option value="México">México</option>
            <option value="Alemania">Alemania</option>
            <option value="Noruega">Noruega</option>
            <option value="China">China</option>        
            <option value="Japon">Japón</option>
        </select>
        <br></br>
        <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" minlength="8" maxlength="15" required>
        <br></br>
        <input type ="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label>
        <br></br>
        <div class="slidercontainer">
          <input type="range" min="0" max="10" value="0"></div>
        <br></br>
        <input type="reset" value="Reset">
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
